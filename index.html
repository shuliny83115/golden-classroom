<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Classroom</title><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<main id="loginView" class="login-shell"><form id="loginForm" class="login-card"><div class="brand">Golden Classroom</div><h1>登入線上教室</h1><p class="muted">登入後會自動進入您的授課教室。</p><label>帳號<input id="account" autocomplete="username" placeholder="teacher01" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">登入</button><p id="loginError" class="error"></p><div class="test-accounts">測試帳號：teacher01 / teacher01、student01 / student01</div></form></main>
<main id="classroomView" class="classroom hidden"><header class="topbar"><div><strong>Golden Classroom</strong><span id="userBadge" class="badge"></span></div><div class="top-actions"><span id="roomStatus" class="status-dot">● Room 連線中</span><button id="logoutBtn" class="ghost">登出</button></div></header><section class="workspace"><aside class="video-column"><section class="video-card">
  <div class="video-label">老師視訊</div>

  <div class="video-stage">
    <video
      id="teacherVideo"
      class="class-video"
      autoplay
      playsinline
    ></video>

    <div id="teacherCameraOff" class="camera-off hidden">
      <div class="camera-off-icon">📷</div>
      <div>老師已關閉攝影機</div>
    </div>
  </div>
</section>

<section class="video-card">
  <div class="video-label">學生視訊</div>

  <div class="video-stage">
    <video
      id="studentVideo"
      class="class-video"
      autoplay
      playsinline
    ></video>

    <div id="studentCameraOff" class="camera-off hidden">
      <div class="camera-off-icon">📷</div>
      <div>學生已關閉攝影機</div>
    </div>
  </div>
</section></aside><section class="vm-panel"><div class="vm-top">
  <div>
    <div id="roomName" class="room-title">Room 1</div>
    <div class="muted small">
      虛擬機畫面將在 Room Agent 完成後顯示於此
    </div>
  </div>

  <div class="vm-top-actions">
    <button id="vmZoomOut" class="vm-zoom-btn">−</button>
    <span id="vmZoomLabel" class="vm-zoom-label">100%</span>
    <button id="vmZoomIn" class="vm-zoom-btn">＋</button>
    <button id="vmFitBtn" class="vm-fit-btn">符合視窗</button>
    <div id="modePill" class="mode-pill">老師控制</div>
  </div>
</div>

<div class="vm-screen"><div class="vm-empty"><div class="monitor-icon">▣</div><strong>等待 Room Agent</strong><span>目前先驗證登入、角色、Room 配對與控制模式。</span></div></div></section></section><footer class="toolbar"><button id="micBtn" class="tool">🎤 麥克風</button>
<button id="cameraBtn" class="tool">📷 攝影機</button><div id="controlWrap" class="control-wrap"><button id="controlBtn" class="tool">控制模式 <span id="controlLabel">老師控制</span> ▾</button><div id="controlMenu" class="menu hidden"><button data-mode="teacher">老師控制</button><button data-mode="student">學生控制</button><button data-mode="shared">雙人控制</button></div></div><div id="studentHint" class="student-hint"></div></footer><div id="toast" class="toast hidden"></div></main><script src="./config.js"></script><script src="./app.js?v=25"></script></body></html>
